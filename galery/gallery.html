    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="closeLightbox">&times;</span>
        <div id="lightbox-media-container">
            </div>
    </div>

    <script>
        /* --- 4. Логіка JavaScript --- */
        const galleryItems = document.querySelectorAll('.gallery-item');
        const lightbox = document.getElementById('lightbox');
        const closeBtn = document.getElementById('closeLightbox');
        const mediaContainer = document.getElementById('lightbox-media-container');

        // Відкриття Lightbox
        galleryItems.forEach(item => {
            item.addEventListener('click', () => {
                const type = item.getAttribute('data-type');
                const src = item.getAttribute('data-src');
                
                mediaContainer.innerHTML = ''; // Очистити попередній контент

                if (type === 'image') {
                    const img = document.createElement('img');
                    img.src = src;
                    img.className = 'lightbox-content';
                    mediaContainer.appendChild(img);
                } else if (type === 'video') {
                    const video = document.createElement('video');
                    video.src = src;
                    video.className = 'lightbox-content';
                    video.controls = true; // Показати кнопки play/pause
                    video.autoplay = true;
                    mediaContainer.appendChild(video);
                }

                lightbox.classList.add('active');
            });
        });

        // Закриття Lightbox
        const closeGallery = () => {
            lightbox.classList.remove('active');
            mediaContainer.innerHTML = ''; // Очистити пам'ять (зупинити відео)
        };

        closeBtn.addEventListener('click', closeGallery);

        // Закриття при кліку поза межами фото
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeGallery();
            }
        });
        
        // Закриття клавішею Esc
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeGallery();
        });
    </script>
